name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and build extension
        run: |
          npm run typecheck
          npm test
          npm run build --workspace=@stiksound/extension
      - name: Package Chrome extension zip
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          (cd apps/extension/dist && zip -r "../../../release-assets/StikSound-${VERSION}-chrome-extension.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: extension-assets
          path: release-assets/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build --workspace=@stiksound/desktop
      - name: Build Tauri Windows installers and executable
        shell: pwsh
        run: |
          npx --workspace=@stiksound/desktop tauri build --bundles nsis,msi
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "${{ github.event.inputs.tag }}" }
          $ver = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "target/release/stiksound-desktop.exe" "release-assets/StikSound-${ver}-windows-x64.exe"
          Get-ChildItem "target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "release-assets/StikSound-${ver}-windows-x64-setup.exe"
          }
          Get-ChildItem "target/release/bundle/msi/*.msi" | ForEach-Object {
            Copy-Item $_.FullName "release-assets/StikSound-${ver}-windows-x64.msi"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build --workspace=@stiksound/desktop
      - name: Build Tauri macOS Universal (.app & .dmg)
        shell: bash
        run: |
          npx --workspace=@stiksound/desktop tauri build --target universal-apple-darwin --bundles app,dmg
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "release-assets/StikSound-${VERSION}-macos-universal.dmg"
          (cd target/universal-apple-darwin/release/bundle/macos && zip -r "../../../../../release-assets/StikSound-${VERSION}-macos-universal.app.zip" StikSound.app)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies and build the web bundle
        run: |
          npm ci
          npm run build -w @stiksound/android
      - name: Restore the release keystore from secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STIKSOUND_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret STIKSOUND_KEYSTORE_B64. See README > App Android > Publicar el APK firmado."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stiksound-release.jks"
          echo "STIKSOUND_KEYSTORE_FILE=$RUNNER_TEMP/stiksound-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: apps/android/android
        env:
          STIKSOUND_KEYSTORE_PASSWORD: ${{ secrets.STIKSOUND_KEYSTORE_PASSWORD }}
          STIKSOUND_KEY_ALIAS: ${{ secrets.STIKSOUND_KEY_ALIAS }}
          STIKSOUND_KEY_PASSWORD: ${{ secrets.STIKSOUND_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PskipWebBuild testDebugUnitTest assembleRelease
      - name: Package APK
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/stiksound-release.jks"
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" != v* ]]; then TAG="${{ github.event.inputs.tag }}"; fi
          VERSION="${TAG#v}"
          mkdir -p release-assets
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk "release-assets/StikSound-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: release-assets/*

  publish-release:
    needs: [build-extension, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          ls -lh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref_name, 'v') && github.ref_name || github.event.inputs.tag }}
          name: StikSound ${{ startsWith(github.ref_name, 'v') && github.ref_name || github.event.inputs.tag }} — Windows, macOS, Android & Chrome Extension
          generate_release_notes: true
          body: |
            ## Descargas listas para usar (sin instalar FFmpeg ni dependencias extra)

            | Plataforma | Archivo recomendado | Cómo usar |
            | --- | --- | --- |
            | **Windows 10/11 (64-bit)** | `StikSound-*-windows-x64.exe` *(portable)* o `*-setup.exe` *(instalador)* | Doble clic para abrir o instalar al instante. |
            | **macOS (Apple Silicon & Intel)** | `StikSound-*-macos-universal.dmg` o `.app.zip` | Arrastra `StikSound.app` a **Aplicaciones**. *(Si macOS muestra aviso de desarrollador no verificado: clic derecho → **Abrir**).* |
            | **Android 10+** | `StikSound-*-android.apk` | Ábrelo en el móvil y permite **Instalar apps desconocidas** para tu navegador o gestor de archivos. Para un sticker con sonido: **⬇ Guardar** (va a la Galería) y en WhatsApp → 😊 → Stickers → **Crear**. |
            | **Google Chrome / Edge / Brave** | `StikSound-*-chrome-extension.zip` | Descomprime el ZIP, abre `chrome://extensions/`, activa **Modo de desarrollador** y pulsa **Cargar descomprimida** seleccionando la carpeta descomprimida. |

            ### Qué incluye esta versión
            - Soporte para stickers **PNG con transparencia**, **WebP**, **JPG** y **GIF animado** (en bucle durante el fragmento exportado, hasta 10 segundos).
            - Encuadre `1:1` automático desde el centro o moviendo el mouse encima **sin hacer clic**.
            - Selector directo de transparencia (**Transparente**, **Blanco**, **Negro** o **Color**).
            - Recorte de audio local (MP3/WAV/OGG/M4A) o enlace de **MyInstants** en ventana de **10 segundos**.
            - Flecha **`➔`** para previsualizar y copiar directo al portapapeles (`Ctrl+V` / `Cmd+V` en WhatsApp) y botón **`⬇`** para descargar eligiendo el formato (MP4, WebM transparente, ZIP o WebP).
          files: artifacts/*
